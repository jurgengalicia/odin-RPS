<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Console</title>
    
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="button-banner-combo">
        <div class="button-flex">
            <button class="rock-el">Rock</button>
            <button class="paper-el">Paper</button>
            <button class="scissors-el">Scissors</button>
        </div>
        <div class="display-banner">
            <h3 class="announce-div">Welcome to Rock Paper Scissors! Make your selection to start a game.</h3>
            <div class="round-div"></div>
            <div class="tally-div"></div>
            <button class="hide-button">Try again</button>
        </div>
    </div>
    
</body>
</html>
